name: J.A.R.V.I.S CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - 'jarvis/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    name: Lint e Verificação Estática
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Lint with mypy
        run: |
          pip install mypy
          mypy jarvis/

      - name: Check formatting
        run: |
          pip install black
          black --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        use: actions/checkout@v4

      - name: Setup Python
        use: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_phase1_chat.py

      - name: Verify coverage
        run: |
          pip install coverage
          coverage run -m pytest -q --ignore=tests/test_phase1_chat.py
          coverage report -m

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        use: actions/checkout@v4

      - name: Install safety
        run: pip install safety

      - name: Check for vulnerable dependencies
        run: safety check

      - name: Check for secret leaks
        run: truffleHog detect --repo .

  package:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        use: actions/checkout@v4

      - name: Setup Python
        use: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create distributable
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dist
          path: dist/

  docker:
    needs: package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        use: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu-action@v5

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v5

      - name: Login to DockerHub
        uses: docker/login-action@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          tags: |
            latest
            semver:${{ github.ref_name }}
            semver-fallback:${{ github.head_ref }}
          push: true

  documentation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        use: actions/checkout@v4

      - name: Install dependencies for docs
        run: |
          pip install mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/

  notify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Notify on completion
        run: echo "J.A.R.V.I.S CI/CD pipeline completed - Status: ${{ job.status }}"

